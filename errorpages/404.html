<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | GeiserSoft</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/theme.js"></script>
    <style>
        .error-container {
            text-align: center;
            padding: 80px 20px;
            min-height: 50vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .error-code {
            font-size: 8em;
            font-weight: bold;
            color: var(--accent-color);
            margin: 0;
            line-height: 1;
        }

        .error-message {
            font-size: 1.5em;
            margin: 20px 0 10px;
            color: var(--heading-color);
        }

        .error-description {
            font-size: 1.1em;
            margin-bottom: 30px;
            max-width: 500px;
            opacity: 0.85;
        }

        .error-home-link {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .error-home-link:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <img src="/images/GeiserSoft.svg" alt="GeiserSoft Logo" class="logo">
            <h1>GeiserSoft</h1>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Switch to dark mode">
            <span class="theme-toggle-icon" aria-hidden="true">☀️</span>
            <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
            <span class="theme-toggle-thumb"></span>
        </button>
    </header>

    <div class="container">
        <main class="error-container">
            <p class="error-code">404</p>
            <h2 class="error-message">Page Not Found</h2>
            <p class="error-description">The resource you requested doesn't exist, was moved, or maybe it was just a dream you had during an on-call shift.</p>
            <a href="/" class="error-home-link">Back to Home</a>
        </main>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 GeiserSoft. All rights reserved.</p>
            <p>For questions or support, please contact us.</p>
            <a href="mailto:mgeiser@mgeiser.net" title="Click to send an email">Click here to Email us</a>
        </div>
    </footer>
</body>
</html>
